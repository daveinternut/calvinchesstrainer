name: calvinchesstrainer
description: "A chess learning app that teaches fundamentals through interactive drills and timed challenges."
publish_to: 'none'
version: 1.6.0+9

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # UI
  go_router: ^17.1.0

  # State management
  flutter_riverpod: ^3.2.1

  # Chess UI + logic (lichess packages)
  chessground: ^8.0.1
  dartchess: ^0.12.1
  fast_immutable_collections: ^11.1.0

  # Chess engine
  stockfish: ^1.8.1
  ffi: ^2.2.0 # imported directly by stockfish_engine_io.dart

  # Audio
  just_audio: ^0.10.5
  audio_session: ^0.2.4
  flutter_tts: ^4.2.5

  # Device storage + app info
  shared_preferences: ^2.5.5 # personal bests, drill settings, Continue
  package_info_plus: ^10.2.2 # version shown on the About screen

  # Firebase
  firebase_core: ^4.4.0
  firebase_analytics: ^12.1.2
  flutter_native_splash: ^2.4.7
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/puzzles/
    - assets/images/
    - assets/data/
    # The fonts' SIL Open Font License texts, registered with LicenseRegistry.
    - assets/licenses/

  # Bundled, never downloaded: offline first launch, kids' privacy. Static
  # instances from Google Fonts (Bricolage Grotesque at optical size 14).
  # Cyrillic and CJK fall back to the platform font.
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Regular.ttf
          weight: 400
        - asset: assets/fonts/BricolageGrotesque-Medium.ttf
          weight: 500
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/GeistMono-SemiBold.ttf
          weight: 600

flutter_native_splash:
  color: "#1B5E20"
  image: assets/images/internut_logo_white.png
  android_12:
    color: "#1B5E20"
    image: assets/images/internut_logo_white.png

# Icon art comes from tool/store_assets/store_assets_test.dart (the LogoMark);
# re-render it there, then run `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "resources/icon/app_icon_background.png"
  adaptive_icon_foreground: "resources/icon/app_icon_foreground.png"
  adaptive_icon_foreground_inset: 0 # the art already sits in the safe zone
  adaptive_icon_monochrome: "resources/icon/app_icon_monochrome.png"
